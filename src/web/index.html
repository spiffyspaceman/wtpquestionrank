<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>WTP Question Rank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/wtpqr-schola-regular.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="narrow">
      <header class="top"><span class="brand">WTP Question Rank</span><nav><button id="themeToggle" class="theme" type="button" aria-label="Switch between day and night colours">Night</button></nav></header>
      <h1>Which hearing question is better?</h1>
      <p class="intro">Compare two published We the People hearing questions at a time and pick the better one.</p>

      <form id="redeem" class="signin" novalidate>
        <label for="code">Your invite code</label>
        <input id="code" class="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" required />
        <div id="turnstile" class="turnstile"></div>
        <p id="msg" class="notice" role="alert" hidden></p>
        <button id="go" class="primary" type="submit">Start</button>
      </form>

      <p class="fineprint">Your code is your login on any device. The site stores no names or email addresses.</p>
    </main>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
