<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vote - WTP Question Rank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/wtpqr-schola-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <a class="brand" href="/vote">WTP Question Rank</a>
        <nav>
          <span id="who" class="who"></span>
          <a id="boardLink" href="/board" hidden>Leaderboard</a>
        </nav>
      </header>

      <p id="msg" class="notice" role="alert" hidden></p>

      <section id="judge" hidden aria-labelledby="criterion">
        <p class="criterion" id="criterion"></p>
        <div class="progress">
          <span id="position" aria-live="polite"></span>
          <progress id="bar" max="10" value="0" aria-hidden="true"></progress>
        </div>
        <div class="pair">
          <article class="card" aria-labelledby="leftH">
            <h2 id="leftH">Question A</h2>
            <p class="stem" id="leftStem"></p>
            <ul id="leftBullets"></ul>
          </article>
          <article class="card" aria-labelledby="rightH">
            <h2 id="rightH">Question B</h2>
            <p class="stem" id="rightStem"></p>
            <ul id="rightBullets"></ul>
          </article>
        </div>
        <div class="decide">
          <div class="close-row"><label class="check"><input type="checkbox" id="close" aria-keyshortcuts="c" /> Close call</label></div>
          <div class="picks">
            <button class="primary" id="pickL" type="button" aria-keyshortcuts="ArrowLeft">A is better</button>
            <button class="primary" id="pickR" type="button" aria-keyshortcuts="ArrowRight">B is better</button>
          </div>
          <div class="skip-row"><button id="skip" class="link" type="button" aria-keyshortcuts="s">Skip</button></div>
        </div>
      </section>

      <section id="between" hidden>
        <h1 tabindex="-1" id="betweenH">Batch done</h1>
        <p id="betweenText"></p>
        <div class="actions">
          <button id="more" class="primary" type="button">Keep going</button>
          <button id="stop" type="button">Stop for now</button>
        </div>
      </section>

      <section id="stopped" hidden>
        <h1 tabindex="-1" id="stoppedH">Thank you</h1>
        <p>Your votes are saved. Your code works on any device.</p>
        <p id="stoppedBoard" hidden><a href="/board">See the leaderboard</a></p>
        <div class="actions"><button id="resume" type="button">Judge more pairs</button></div>
      </section>
    </main>
    <script type="module" src="./vote.ts"></script>
  </body>
</html>
