<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vote - WTP Question Rank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/wtpqr-schola-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <a class="brand" href="/start">WTP Question Rank</a>
        <nav>
          <span id="who" class="who"></span>
          <a id="boardLink" href="/board" hidden>Leaderboard</a>
        </nav>
      </header>

      <p id="msg" class="notice" role="alert" hidden></p>

      <section id="judge" hidden aria-labelledby="criterion">
        <p class="criterion" id="criterion"></p>
        <div class="progress">
          <button id="back" class="link nav" type="button" hidden>Back</button>
          <span id="position" aria-live="polite"></span>
          <progress id="bar" max="10" value="0" aria-hidden="true"></progress>
          <button id="fwd" class="link nav" type="button" hidden>Forward</button>
        </div>
        <div class="pair" id="pair">
          <article class="card pickable" id="leftCard" aria-labelledby="leftH">
            <h2 id="leftH">Question A</h2>
            <p class="stem" id="leftStem"></p>
            <ul id="leftBullets"></ul>
          </article>
          <article class="card pickable" id="rightCard" aria-labelledby="rightH">
            <h2 id="rightH">Question B</h2>
            <p class="stem" id="rightStem"></p>
            <ul id="rightBullets"></ul>
          </article>
        </div>
        <div class="decide">
          <div class="picks" id="picks">
            <button class="pick" id="pickL" type="button" aria-pressed="false" aria-keyshortcuts="ArrowLeft">A is better</button>
            <button class="pick" id="pickR" type="button" aria-pressed="false" aria-keyshortcuts="ArrowRight">B is better</button>
          </div>
          <div id="after" hidden>
            <div class="reasons" role="group" aria-labelledby="reasonsH">
              <p id="reasonsH" class="reasons-h"><span id="whyText">Why is it better?</span> <span class="muted">If you like, up to two</span></p>
              <div id="pills" class="pills"></div>
              <div id="otherRow" class="other-row" hidden>
                <label for="otherText" class="sr-only">Other reason</label>
                <input id="otherText" type="text" maxlength="200" autocomplete="off" aria-describedby="otherCount otherNote" />
                <p class="other-meta"><span id="otherNote">No names or personal details.</span> <span id="otherCount" aria-live="polite"></span></p>
              </div>
            </div>
            <div class="close-row"><label class="check"><input type="checkbox" id="close" aria-keyshortcuts="c" /> Close call</label></div>
            <div class="next-row"><button class="primary" id="next" type="button" aria-keyshortcuts="Enter">Next</button></div>
          </div>
          <div class="skip-row"><button id="skip" class="link" type="button" aria-keyshortcuts="s">Skip</button></div>
        </div>
      </section>

      <section id="between" hidden>
        <h1 tabindex="-1" id="betweenH">Batch done</h1>
        <p id="betweenText"></p>
        <div class="actions">
          <button id="more" class="primary" type="button">Keep going</button>
          <button id="backFromDone" type="button">Back to this batch</button>
          <a id="stop" class="button" href="/start">Stop for now</a>
        </div>
      </section>
    </main>
    <script type="module" src="./vote.ts"></script>
  </body>
</html>
