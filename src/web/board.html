<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Leaderboard - WTP Question Rank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/wtpqr-schola-regular.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="board-page">
    <main>
      <header class="top">
        <a class="brand" href="/start">WTP Question Rank</a>
        <nav><a href="/vote">Back to voting</a><button id="themeToggle" class="switch" type="button" role="switch" aria-checked="false"><span class="switch-label">Night</span><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button></nav>
      </header>
      <p id="msg" class="notice" role="alert" hidden></p>
      <div id="content" hidden>
        <div class="board-head">
          <h1>Leaderboard</h1>
          <div class="board-pick">
            <div id="roundPick" class="control" hidden><label for="roundSel">Questions</label><select id="roundSel"></select></div>
            <div class="tabs" id="tabs" role="group" aria-label="Whose votes"></div>
          </div>
        </div>
        <p id="summary" class="scale-note" aria-live="polite"></p>
        <p id="roleNote" class="scale-note" hidden></p>

        <section id="topSection" class="hero" aria-labelledby="topH" hidden>
          <h2 id="topH" class="sr-only">Top question</h2>
          <div id="top"></div>
        </section>

        <div class="board-grid">
        <section aria-labelledby="top10H">
          <h2 id="top10H">Top 10</h2>
          <ol class="ranklist" id="top10"></ol>
          <p id="noneRanked" class="muted" hidden></p>
        </section>

        <section id="explore" class="explore" aria-labelledby="exploreH">
          <h2 id="exploreH">Explore</h2>
          <div class="tabs charttabs" role="tablist" aria-label="Chart">
            <button type="button" role="tab" id="tab-groups" aria-selected="true" aria-controls="panel">Groups</button>
            <button type="button" role="tab" id="tab-scatter" aria-selected="false" aria-controls="panel">Any two</button>
            <button type="button" role="tab" id="tab-dist" aria-selected="false" aria-controls="panel">Distribution</button>
            <button type="button" role="tab" id="tab-h2h" aria-selected="false" aria-controls="panel">Head to head</button>
          </div>
          <div id="panel" role="tabpanel">
            <div id="controls" class="controls"></div>
            <div id="chart" class="chart"></div>
            <p id="chartNote" class="muted small"></p>
            <details id="chartTableWrap" class="chart-table"><summary>Table</summary><div class="table-wrap"><table id="chartTable"></table></div></details>
          </div>
          <div id="tip" class="tip" role="status" hidden></div>
        </section>
        </div>

        <section aria-labelledby="allH">
          <h2 id="allH">All questions</h2>
          <div class="filters">
            <div class="grow"><label for="q">Search</label><input id="q" type="search" autocomplete="off" spellcheck="false" /></div>
            <div><label for="fUnit">Unit</label><select id="fUnit"></select></div>
            <div><label for="fYear">Year</label><select id="fYear"></select></div>
            <label class="check"><input id="fRanked" type="checkbox" /> Ranked only</label>
          </div>
          <p id="allCount" class="muted small" aria-live="polite"></p>
          <div class="table-wrap"><table id="all" class="qtable"></table></div>
          <div class="pager"><button id="prevPage" type="button">Previous</button><span id="pageInfo" class="muted small"></span><button id="nextPage" type="button">Next</button></div>
        </section>

        <p class="scale-note">The average question is 1000. A 400-point lead wins about 10 times in 11. Questions are ranked
          after 10 comparisons. <span id="intervals"></span></p>
      </div>
    </main>
    <script type="module" src="./board.ts"></script>
  </body>
</html>
