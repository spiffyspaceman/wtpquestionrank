<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Leaderboard - WTP Question Rank</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/wtpqr-schola-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <a class="brand" href="/vote">WTP Question Rank</a>
        <nav><a href="/vote">Back to voting</a></nav>
      </header>
      <h1>Leaderboard</h1>
      <p id="msg" class="notice" role="alert" hidden></p>
      <div id="content" hidden>
        <div class="tabs" id="tabs" role="group" aria-label="Whose votes"></div>
        <p id="summary" class="scale-note" aria-live="polite"></p>
        <p class="scale-note">The average question is 1000. A 400-point lead wins about 10 times in 11. <span id="intervals"></span></p>
        <h2 id="rankedH">Ranked</h2>
        <ol class="board" id="rows" aria-labelledby="rankedH"></ol>
        <p id="noneRanked" class="muted" hidden>No question has 10 comparisons yet.</p>
        <h2 id="unrankedH">Fewer than 10 comparisons</h2>
        <ol class="board unranked" id="unrankedRows" aria-labelledby="unrankedH"></ol>
      </div>
    </main>
    <script type="module" src="./board.ts"></script>
  </body>
</html>
